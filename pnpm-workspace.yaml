packages:
  - "apps/*"
  - "packages/*"
  - "workers/*"
  - "tools/*"

# Algunas dependencias necesitan ejecutar su instalador para dejar su binario listo. pnpm
# lo bloquea por defecto (bien: evita ejecutar codigo arbitrario sin querer); se autoriza
# caso por caso, de forma explicita.
#
#  - esbuild: transitiva de Vitest.
#  - workerd: el runtime de Cloudflare Workers, transitiva de Wrangler. Sin su instalador,
#    `wrangler dev` y `wrangler deploy` no funcionan.
allowBuilds:
  esbuild: true
  workerd: true

# Wrangler arrastra undici, y la version que resolvio tenia una vulnerabilidad media
# (GHSA-3wwx-pv8p-q78v) que el escaneo de Seguridad detecto en el primer despliegue. Se
# fuerza la version corregida para no publicar con un fallo conocido.
overrides:
  undici: ^7.29.1
