name: Sondeo temporal keep-alive

# TEMPORAL. Comprueba a mano los dos sondeos del cron de keep-alive contra produccion:
#  (a) `select 1` por el Session pooler con PGSSLMODE=verify-full y la CA de Supabase.
#  (b) GET /rest/v1/ con la cabecera apikey (basta con que responda).
# No imprime credenciales. Se borra tras usarlo.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sondeo-keepalive
  cancel-in-progress: false

env:
  CLAVE_CA: packages/db/certs/prod-ca-2021.crt

jobs:
  sondear:
    name: Comprobar los dos sondeos contra produccion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar el cliente de PostgreSQL 17 (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: "Sondeo (a): select 1 por el Session pooler"
        env:
          CAMARERO_DB_URL_ADMIN: ${{ secrets.CAMARERO_DB_URL_ADMIN }}
          CAMARERO_DB_PASSWORD_ADMIN: ${{ secrets.CAMARERO_DB_PASSWORD_ADMIN }}
        run: |
          set -euo pipefail
          export PGPASSWORD="$CAMARERO_DB_PASSWORD_ADMIN"
          export PGSSLMODE=verify-full
          export PGSSLROOTCERT="$GITHUB_WORKSPACE/$CLAVE_CA"
          # Diagnostico sin credenciales: solo el host del destino.
          DESTINO="$(printf '%s' "$CAMARERO_DB_URL_ADMIN" | sed -E 's#^[a-z]+://[^@]*@##; s#[:/].*$##')"
          echo "Destino (a): $DESTINO"
          echo "ssl mode: $PGSSLMODE"
          /usr/lib/postgresql/17/bin/psql "$CAMARERO_DB_URL_ADMIN" \
            -v ON_ERROR_STOP=1 -tAc 'select 1 as sondeo;'

      - name: "Sondeo (b): GET /rest/v1/ con apikey"
        env:
          CAMARERO_DB_URL_ADMIN: ${{ secrets.CAMARERO_DB_URL_ADMIN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # La SUPABASE_URL del Worker es https://<ref>.supabase.co; el ref sale del usuario
          # del pooler (`postgres.<ref>`). No se imprime la URL ni la clave.
          USUARIO="$(printf '%s' "$CAMARERO_DB_URL_ADMIN" | sed -E 's#^[a-z]+://##; s#:.*##')"
          REF="${USUARIO#postgres.}"
          CODE="$(curl --silent --show-error --output cuerpo.txt --write-out '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" "https://${REF}.supabase.co/rest/v1/")"
          echo "Sondeo (b): codigo HTTP $CODE"
          echo "Cuerpo (primeros 300 caracteres):"
          head -c 300 cuerpo.txt; echo
          rm -f cuerpo.txt
