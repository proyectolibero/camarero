name: Verificacion temporal emparejamiento

# TEMPORAL. Solo mide la base real en transacciones que se deshacen. Se borra al terminar.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar aprobacion con el dueno
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activar pnpm
        uses: pnpm/action-setup@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Escribir el verificador
        run: |
          cat > packages/db/verificacion-temporal.mjs <<'EOF'
          import { readFile } from "node:fs/promises"
          import { randomUUID } from "node:crypto"
          import pg from "pg"
          const { Client } = pg
          const log = (...a) => console.log(...a)

          function paramsFromUrl(url, pass) {
            const u = new URL(url)
            return {
              host: u.hostname,
              port: u.port === "" ? 5432 : Number(u.port),
              database: u.pathname.replace(/^\//, "") || "postgres",
              user: decodeURIComponent(u.username),
              password: pass ?? decodeURIComponent(u.password),
            }
          }
          function userFor(adminUser, role) {
            const i = adminUser.indexOf(".")
            return i === -1 ? role : role + adminUser.slice(i)
          }
          async function connect(p, ca) {
            const c = new Client({ ...p, ssl: { rejectUnauthorized: true, ca }, connectionTimeoutMillis: 20000 })
            await c.connect()
            return c
          }
          async function ctx(c, pares) {
            for (const [k, v] of pares) await c.query("select set_config($1,$2,true)", [k, v])
          }

          const url = process.env.CAMARERO_DB_URL_ADMIN
          const adminPass = process.env.CAMARERO_DB_PASSWORD_ADMIN
          const appPass = process.env.CAMARERO_DB_PASSWORD_APP
          if (!url || !adminPass || !appPass) throw new Error("Faltan secretos de base")

          const ca = await readFile("packages/db/certs/prod-ca-2021.crt", "utf8")
          const admin = paramsFromUrl(url, adminPass)
          const appParams = { ...admin, user: userFor(admin.user, "camarero_app"), password: appPass }
          log(`Destino: ${admin.host}:${admin.port}`)

          const a = await connect(admin, ca)
          try {
            log("\n===== 0. La migracion 0019 esta aplicada =====")
            const fns = await a.query(
              `select proname from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                where n.nspname='public' and proname in ('camarero_decidir_emparejamiento','camarero_ventana_de_emparejamiento','camarero_expirar_solicitudes','solicitud_caducada','camarero_auditar_decision')
                order by proname`)
            log(`Funciones nuevas presentes: ${fns.rows.map((r) => r.proname).join(", ")}`)
            const dur = await a.query("select extract(epoch from public.camarero_ventana_de_emparejamiento())::int as s")
            log(`Ventana de emparejamiento (segundos): ${dur.rows[0].s}`)
            const pol = await a.query(`select policyname from pg_policies where schemaname='public' and tablename='pairing_requests' order by policyname`)
            log(`Politicas de pairing_requests: ${pol.rows.map((r) => r.policyname).join(", ")}`)

            log("\n===== 1. Datos reales (sin PII) =====")
            const loc = await a.query("select id, org_id, slug, status from public.locations order by created_at")
            const staff = await a.query("select id, org_id, location_id, role, active from public.staff order by role, created_at")
            const tablas = await a.query("select t.id, t.code, t.label, t.location_id, l.org_id, l.status as local_status from public.tables t join public.locations l on l.id = t.location_id order by t.created_at")
            log(`Localizaciones: ${JSON.stringify(loc.rows)}`)
            log(`Empleados: ${JSON.stringify(staff.rows)}`)
            log(`Mesas: ${JSON.stringify(tablas.rows)}`)

            const mesa = tablas.rows[0]
            const owner = staff.rows.find((s) => s.role === "org_owner" && s.org_id === mesa?.org_id)
            const otro = staff.rows.find((s) => ["location_manager", "server", "kitchen", "no_pin"].includes(s.role) && s.location_id && s.location_id !== mesa?.location_id)
            log(`Mesa elegida: ${mesa ? `${mesa.code} (${mesa.label}, local ${mesa.local_status})` : "ninguna"}`)
            log(`Dueno elegido: ${owner ? `${owner.id} org=${owner.org_id}` : "ninguno"}`)
            log(`Actor de otro local: ${otro ? `${otro.id} local=${otro.location_id}` : "ninguno (solo hay un empleado)"}`)

            if (!mesa || !owner) {
              log("No hay mesa o dueno: no se puede reproducir.")
            } else {
              const ctxPlataforma = [["app.role", "platform_admin"], ["app.staff_id", owner.id], ["app.org_id", owner.org_id], ["app.location_id", ""], ["app.session_id", ""]]
              const ctxDueno = [["app.role", "org_owner"], ["app.staff_id", owner.id], ["app.org_id", owner.org_id], ["app.location_id", owner.location_id ?? ""], ["app.session_id", ""]]
              const sembrar = async (c) => {
                await ctx(c, ctxPlataforma)
                const ses = randomUUID()
                await c.query(
                  `insert into public.table_sessions (id, location_id, table_id, code, state, pairing_expires_at)
                   values ($1,$2,$3,$4,'pairing', now() + public.camarero_ventana_de_emparejamiento())`,
                  [ses, mesa.location_id, mesa.id, mesa.label])
                const req = randomUUID()
                await c.query("insert into public.pairing_requests (id, session_id, table_id, state) values ($1,$2,$3,'pending')", [req, ses, mesa.id])
                return { ses, req }
              }

              log("\n===== 2. EL DUENO APRUEBA: UPDATE directo con RLS (transaccion deshecha) =====")
              {
                const c = await connect(appParams, ca)
                try {
                  await c.query("begin")
                  const { req } = await sembrar(c)
                  await ctx(c, ctxDueno)
                  const upd = await c.query(
                    `update public.pairing_requests set state='approved', decided_by=public.staff_actual(), decided_at=now()
                      where id=$1 and state='pending'`, [req])
                  log(`FILAS AFECTADAS por el UPDATE con el contexto del dueno: ${upd.rowCount}`)
                  await c.query("rollback")
                } catch (e) { await c.query("rollback").catch(() => {}); log(`ERROR ${e.code ?? ""} ${e.message}`) } finally { await c.end() }
              }

              log("\n===== 3. La puerta unica: clasifica, activa la sesion y audita =====")
              {
                const c = await connect(appParams, ca)
                try {
                  await c.query("begin")
                  const { ses, req } = await sembrar(c)
                  await ctx(c, ctxDueno)
                  const causa = await c.query("select public.camarero_decidir_emparejamiento($1,'approved',null) as causa", [req])
                  log(`causa devuelta: ${causa.rows[0].causa}`)
                  const pr = await c.query("select state, decided_by is not null as con_rastro, decided_at is not null as con_fecha from public.pairing_requests where id=$1", [req])
                  log(`pairing_request: ${JSON.stringify(pr.rows[0])}`)
                  const ss = await c.query("select state, pairing_expires_at from public.table_sessions where id=$1", [ses])
                  log(`sesion: state=${ss.rows[0].state} pairing_expires_at=${ss.rows[0].pairing_expires_at}`)
                  const au = await c.query("select action from public.audit_log where entity='pairing_request' and entity_id=$1", [req])
                  log(`auditoria: ${JSON.stringify(au.rows)}`)
                  await c.query("rollback")
                } catch (e) { await c.query("rollback").catch(() => {}); log(`ERROR ${e.code ?? ""} ${e.message}`) } finally { await c.end() }
              }

              log("\n===== 4. Un empleado de OTRO local no puede (transaccion deshecha) =====")
              if (!otro) {
                log("No existe un empleado de otro local en la base real: no se puede contrastar en vivo; la prueba de base lo cubre.")
              } else {
                const c = await connect(appParams, ca)
                try {
                  await c.query("begin")
                  const { req } = await sembrar(c)
                  await ctx(c, [["app.role", otro.role], ["app.staff_id", otro.id], ["app.org_id", otro.org_id], ["app.location_id", otro.location_id ?? ""], ["app.session_id", ""]])
                  const upd = await c.query(
                    `update public.pairing_requests set state='approved', decided_by=public.staff_actual(), decided_at=now()
                      where id=$1 and state='pending'`, [req])
                  log(`FILAS AFECTADAS con el contexto de OTRO local: ${upd.rowCount}`)
                  const causa = await c.query("select public.camarero_decidir_emparejamiento($1,'approved',null) as causa", [req])
                  log(`causa devuelta: ${causa.rows[0].causa}`)
                  await c.query("rollback")
                } catch (e) { await c.query("rollback").catch(() => {}); log(`ERROR ${e.code ?? ""} ${e.message}`) } finally { await c.end() }
              }

              log("\n===== 5. El mantenimiento marca caducadas (transaccion deshecha) =====")
              {
                const c = await connect(appParams, ca)
                try {
                  await c.query("begin")
                  const { ses, req } = await sembrar(c)
                  await c.query("update public.table_sessions set pairing_expires_at = now() - interval '1 minute' where id=$1", [ses])
                  await ctx(c, [["app.role", "platform_admin"]])
                  const n = await c.query("select public.camarero_expirar_solicitudes() as n")
                  const estado = await c.query("select state from public.pairing_requests where id=$1", [req])
                  log(`marcadas por el mantenimiento: ${n.rows[0].n}; estado de la solicitud: ${estado.rows[0].state}`)
                  await c.query("rollback")
                } catch (e) { await c.query("rollback").catch(() => {}); log(`ERROR ${e.code ?? ""} ${e.message}`) } finally { await c.end() }
              }
            }
          } finally {
            await a.end()
          }
          EOF

      - name: Ejecutar el verificador
        run: node packages/db/verificacion-temporal.mjs
        env:
          CAMARERO_DB_URL_ADMIN: ${{ secrets.CAMARERO_DB_URL_ADMIN }}
          CAMARERO_DB_PASSWORD_ADMIN: ${{ secrets.CAMARERO_DB_PASSWORD_ADMIN }}
          CAMARERO_DB_PASSWORD_APP: ${{ secrets.CAMARERO_DB_PASSWORD_APP }}
