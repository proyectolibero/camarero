name: Diagnostico temporal emparejamiento

# TEMPORAL. Solo mide; no cambia datos (todo va en transacciones que se deshacen).
# Se borra al terminar el diagnostico.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    name: Medir emparejamiento
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activar pnpm
        uses: pnpm/action-setup@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Escribir el medidor
        run: |
          cat > packages/db/diagnostico-temporal.mjs <<'EOF'
          import { readFile } from "node:fs/promises"
          import pg from "pg"
          const { Client } = pg
          const log = (...a) => console.log(...a)

          function paramsFromUrl(url, pass) {
            const u = new URL(url)
            return {
              host: u.hostname,
              port: u.port === "" ? 5432 : Number(u.port),
              database: u.pathname.replace(/^\//, "") || "postgres",
              user: decodeURIComponent(u.username),
              password: pass ?? decodeURIComponent(u.password),
            }
          }
          function userFor(adminUser, role) {
            const i = adminUser.indexOf(".")
            return i === -1 ? role : role + adminUser.slice(i)
          }
          async function connect(p, ca) {
            const c = new Client({
              ...p,
              ssl: { rejectUnauthorized: true, ca },
              connectionTimeoutMillis: 20000,
            })
            await c.connect()
            return c
          }

          const url = process.env.CAMARERO_DB_URL_ADMIN
          const adminPass = process.env.CAMARERO_DB_PASSWORD_ADMIN
          const appPass = process.env.CAMARERO_DB_PASSWORD_APP
          if (!url || !adminPass || !appPass) throw new Error("Faltan secretos de base")

          const ca = await readFile("packages/db/certs/prod-ca-2021.crt", "utf8")
          const admin = paramsFromUrl(url, adminPass)
          const appParams = { ...admin, user: userFor(admin.user, "camarero_app"), password: appPass }
          log(`Destino: ${admin.host}:${admin.port} (usuarios con referencia de proyecto: si)`)

          const LISTA_SQL = `select pr.id, t.label as mesa,
                    extract(epoch from (now() - pr.created_at))::int as pedida,
                    extract(epoch from (s.pairing_expires_at - now()))::int as restante
               from public.pairing_requests pr
               join public.table_sessions s on s.id = pr.session_id
               join public.tables t on t.id = pr.table_id
              where pr.state = 'pending'
                and (s.pairing_expires_at is null or s.pairing_expires_at > now())
              order by pr.created_at, pr.id`

          const a = await connect(admin, ca)
          try {
            log("\n===== 1. HISTOGRAMA pairing_requests (todas) =====")
            const hist = await a.query(
              `select state, count(*)::int as n, min(created_at) as primera, max(created_at) as ultima
                 from public.pairing_requests group by state order by state`)
            log(JSON.stringify(hist.rows, null, 2))

            log("\n===== 2. ULTIMAS 6 H: pairing_requests + sesion =====")
            const req = await a.query(
              `select pr.id, pr.session_id, pr.table_id, t.label as mesa, t.code as codigo,
                      pr.state as pr_estado, s.state as ses_estado,
                      pr.created_at, s.opened_at, s.pairing_expires_at, pr.decided_at, pr.decided_by,
                      extract(epoch from (pr.created_at - s.opened_at))::int as apertura_a_pedir_s,
                      extract(epoch from (s.pairing_expires_at - pr.created_at))::int as ventana_tras_pedir_s,
                      extract(epoch from (coalesce(pr.decided_at, pr.updated_at) - pr.created_at))::int as pedir_a_decision_s,
                      (s.pairing_expires_at <= now()) as caducada_ahora,
                      extract(epoch from (now() - pr.created_at))::int as antiguedad_s
                 from public.pairing_requests pr
                 join public.table_sessions s on s.id = pr.session_id
                 join public.tables t on t.id = pr.table_id
                where pr.created_at > now() - interval '6 hours'
                order by pr.created_at desc`)
            log(JSON.stringify(req.rows, null, 2))

            log("\n===== 3. ULTIMAS 6 H: table_sessions =====")
            const ses = await a.query(
              `select s.id, s.table_id, t.label as mesa, s.state, s.opened_at, s.pairing_expires_at,
                      extract(epoch from (s.pairing_expires_at - s.opened_at))::int as duracion_ventana_s,
                      extract(epoch from (now() - s.opened_at))::int as antiguedad_s,
                      (s.pairing_expires_at <= now()) as caducada
                 from public.table_sessions s
                 join public.tables t on t.id = s.table_id
                where s.opened_at > now() - interval '6 hours'
                order by s.opened_at desc`)
            log(JSON.stringify(ses.rows, null, 2))

            log("\n===== 4. STAFF (sin datos personales) =====")
            const staff = await a.query(
              `select s.id, s.org_id, s.location_id, s.role, s.active, (s.auth_user_id is not null) as tiene_panel
                 from public.staff s order by s.role, s.created_at`)
            log(JSON.stringify(staff.rows, null, 2))

            log("\n===== 5. LOCATIONS / ORGS =====")
            const loc = await a.query(
              `select l.id, l.org_id, l.slug, l.status from public.locations l order by l.created_at`)
            log(JSON.stringify(loc.rows, null, 2))

            // Candidatos para reproducir
            const pendientes = await a.query(
              `select pr.id, pr.session_id, pr.table_id, s.location_id, s.org_id,
                      (s.pairing_expires_at > now()) as vigente
                 from public.pairing_requests pr
                 join public.table_sessions s on s.id = pr.session_id
                where pr.state = 'pending'
                order by pr.created_at desc`)
            const vigente = pendientes.rows.find((r) => r.vigente) ?? null
            const caducada = pendientes.rows.find((r) => !r.vigente) ?? pendientes.rows[0] ?? null
            const objetivo = caducada ?? vigente
            log("\n===== 6. CANDIDATOS =====")
            log(`pendientes totales: ${pendientes.rowCount}; vigente: ${vigente ? vigente.id : "ninguna"}; caducada: ${caducada ? caducada.id : "ninguna"}`)

            if (objetivo === null) {
              log("No hay ninguna solicitud pendiente: no se puede reproducir sobre filas reales.")
            } else {
              const localObjetivo = objetivo.location_id
              const orgObjetivo = objetivo.org_id
              const actores = {
                org_owner: staff.rows.find((s) => s.role === "org_owner" && s.org_id === orgObjetivo),
                location_manager: staff.rows.find((s) => s.role === "location_manager" && s.location_id === localObjetivo),
                server: staff.rows.find((s) => s.role === "server" && s.location_id === localObjetivo),
                otro_local: staff.rows.find(
                  (s) => ["location_manager", "server", "kitchen", "no_pin"].includes(s.role) && s.location_id !== localObjetivo),
              }

              async function escenario(label, actor, reqId, sesId, extender) {
                if (!actor) {
                  log(`--- ${label}: (no existe ese actor en la base)`)
                  return
                }
                const c = await connect(appParams, ca)
                try {
                  await c.query("begin")
                  const ctx = [["app.role", actor.role], ["app.staff_id", actor.id], ["app.org_id", actor.org_id], ["app.location_id", actor.location_id ?? ""]]
                  for (const [k, v] of ctx) await c.query("select set_config($1,$2,true)", [k, v])
                  if (extender) {
                    await c.query(
                      "update public.table_sessions set pairing_expires_at = now() + interval '90 seconds' where id = $1",
                      [sesId])
                  }
                  const diag = await c.query(
                    `select public.solicitud_vigente($1) as vigente,
                            public.local_de_la_sesion($1) as local_sesion,
                            public.local_del_staff() as local_staff,
                            public.en_mi_local(public.local_de_la_sesion($1)) as en_mi_local,
                            public.es_staff_de_local() as es_staff_local,
                            public.es_org_owner() as es_org_owner,
                            public.en_mi_org(public.org_de_la_sesion($1)) as en_mi_org`,
                    [sesId])
                  const vis = await c.query("select count(*)::int as n from public.table_sessions where id=$1", [sesId])
                  const lista = await c.query(LISTA_SQL)
                  const upd = await c.query(
                    `update public.pairing_requests
                        set state=$2, decided_by=public.staff_actual(), decided_at=now(), reason=$3
                      where id=$1 and state='pending'
                      returning session_id`,
                    [reqId, "approved", null])
                  log(`--- ${label}: actor.rol=${actor.role} actor.id=${actor.id} local=${actor.location_id}`)
                  log(`    funciones: ${JSON.stringify(diag.rows[0])}`)
                  log(`    sesion visible para el actor (count): ${vis.rows[0].n}`)
                  log(`    lista de pendientes que ve: ${lista.rowCount}`)
                  log(`    FILAS AFECTADAS por el UPDATE de aprobacion: ${upd.rowCount}`)
                  await c.query("rollback")
                } catch (e) {
                  await c.query("rollback").catch(() => {})
                  log(`--- ${label}: ERROR ${e && e.code ? e.code : ""} ${e && e.message ? e.message : e}`)
                } finally {
                  await c.end()
                }
              }

              log("\n===== 7. REPRODUCCION CON RLS (transacciones deshechas) =====")
              if (vigente) {
                await escenario("A) org_owner / solicitud REAL vigente", actores.org_owner, vigente.id, vigente.session_id, false)
                await escenario("A2) location_manager / solicitud REAL vigente", actores.location_manager, vigente.id, vigente.session_id, false)
              } else {
                log("A) no hay solicitud real vigente en este momento.")
              }
              if (caducada) {
                await escenario("B) org_owner / solicitud CADUCADA", actores.org_owner, caducada.id, caducada.session_id, false)
                await escenario("B2) org_owner / CADUCADA pero ventana extendida a 90s en la tx", actores.org_owner, caducada.id, caducada.session_id, true)
                await escenario("C) location_manager / solicitud CADUCADA", actores.location_manager, caducada.id, caducada.session_id, false)
                await escenario("C2) server / solicitud CADUCADA", actores.server, caducada.id, caducada.session_id, false)
                await escenario("D) empleado de OTRO local / solicitud CADUCADA", actores.otro_local, caducada.id, caducada.session_id, false)
              } else {
                log("B/C/D) no hay solicitud caducada.")
              }
            }
          } finally {
            await a.end()
          }
          EOF

      - name: Ejecutar el medidor
        run: node packages/db/diagnostico-temporal.mjs
        env:
          CAMARERO_DB_URL_ADMIN: ${{ secrets.CAMARERO_DB_URL_ADMIN }}
          CAMARERO_DB_PASSWORD_ADMIN: ${{ secrets.CAMARERO_DB_PASSWORD_ADMIN }}
          CAMARERO_DB_PASSWORD_APP: ${{ secrets.CAMARERO_DB_PASSWORD_APP }}
