name: Retirar secreto obsoleto

# Temporal: el borde ya no lee SUPABASE_JWT_SECRET (ver ADR-0021). Este workflow se
# ejecuta a mano una sola vez para borrar el secreto del Worker y luego se elimina.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retirar:
    name: Borrar SUPABASE_JWT_SECRET del Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activar pnpm
        uses: pnpm/action-setup@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Borrar el secreto obsoleto
        run: pnpm exec wrangler secret delete SUPABASE_JWT_SECRET --name camarero-api || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
