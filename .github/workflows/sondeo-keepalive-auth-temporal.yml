name: Sondeo temporal keep-alive auth

# TEMPORAL. Comprueba a mano, contra produccion, que endpoint admite la clase de clave que
# tenemos (SUPABASE_ANON_KEY, publishable). No imprime la clave ni la URL. Se borra tras usarlo.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sondeo-keepalive-auth
  cancel-in-progress: false

jobs:
  sondear:
    name: Probar endpoints con la clave publishable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probar endpoints
        env:
          CAMARERO_DB_URL_ADMIN: ${{ secrets.CAMARERO_DB_URL_ADMIN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # El ref del proyecto sale del usuario del pooler (`postgres.<ref>`). No se imprime.
          USUARIO="$(printf '%s' "$CAMARERO_DB_URL_ADMIN" | sed -E 's#^[a-z]+://##; s#:.*##')"
          REF="${USUARIO#postgres.}"
          URL="https://${REF}.supabase.co"

          probar() {
            local etiqueta="$1"; shift
            local code
            code="$(curl --silent --show-error --output cuerpo.txt --write-out '%{http_code}' "$@")"
            echo "== ${etiqueta}: HTTP ${code} =="
            head -c 300 cuerpo.txt; echo; echo
            rm -f cuerpo.txt
          }

          probar "auth/v1/health + apikey" \
            -H "apikey: ${SUPABASE_ANON_KEY}" "${URL}/auth/v1/health"
          probar "auth/v1/health + apikey + Authorization Bearer" \
            -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${URL}/auth/v1/health"
          probar "auth/v1/health sin cabeceras" "${URL}/auth/v1/health"
          probar "auth/v1/settings + apikey" \
            -H "apikey: ${SUPABASE_ANON_KEY}" "${URL}/auth/v1/settings"
          probar "rest/v1/ + apikey (el que fallaba)" \
            -H "apikey: ${SUPABASE_ANON_KEY}" "${URL}/rest/v1/"
