name: Despliegue

# Solo se publica en produccion cuando el workflow de CI ha terminado BIEN sobre main.
# Un fallo de tests, de tipos o de lint no llega nunca a produccion. Es la regla de
# aceptacion de TASK-F0-03 y es tambien la razon por la que el despliegue no vive dentro
# del propio workflow de CI: aqui no se puede publicar sin que el otro haya pasado.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# El despliegue solo lee el repositorio; los secretos de Cloudflare son aparte.
permissions:
  contents: read

# Sin paralelismo: dos despliegues a la vez sobre el mismo dominio se pisarian.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  cloudflare:
    name: Publicar en Cloudflare
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del commit que paso CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Activar pnpm
        uses: pnpm/action-setup@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Publicar la web (Cloudflare Pages)
        run: pnpm run deploy:web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publicar la API (Cloudflare Workers)
        run: pnpm run deploy:api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
