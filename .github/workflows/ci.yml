name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest

    # NO se declara un `services: postgres`. Los tests de packages/db levantan su propio
    # contenedor efimero en el puerto 54322, y un servicio ocupando ese mismo puerto del
    # host haria que el segundo binding fallara y la CI quedara en rojo. El runner de
    # ubuntu-latest ya trae Docker, que es todo lo que los tests necesitan.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activar pnpm
        uses: pnpm/action-setup@v6

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato y lint (Biome)
        run: pnpm biome ci .

      - name: Comprobacion de tipos
        run: pnpm -r run typecheck

      - name: Tests
        run: pnpm -r run test

      # Red de seguridad: si un test muere a mitad, su contenedor puede quedar vivo y
      # consumir el puerto en la siguiente ejecucion. Se limpia siempre, pase lo que pase.
      - name: Limpiar contenedores de prueba huerfanos
        if: always()
        run: docker rm --force $(docker ps --quiet --filter "name=camarero-db-test-") 2>/dev/null || true
