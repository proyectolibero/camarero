name: Diagnostico auth temporal

# WORKFLOW TEMPORAL. Existe solo para comprobar la receta de contrasena de Supabase Auth
# contra el Postgres real, usando los secretos de administracion, y se retira despues.
# No imprime credenciales: el script solo escribe correos, fechas y recuentos.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    name: Comprobar receta de contrasena
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activar pnpm
        uses: pnpm/action-setup@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar el diagnostico
        run: pnpm --filter @camarero/db exec node scripts/diagnostico-password-auth.ts
        env:
          CAMARERO_DB_URL_ADMIN: ${{ secrets.CAMARERO_DB_URL_ADMIN }}
          CAMARERO_DB_PASSWORD_ADMIN: ${{ secrets.CAMARERO_DB_PASSWORD_ADMIN }}
